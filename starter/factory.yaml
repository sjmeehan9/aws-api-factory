# AWS API Factory - Starter Template Configuration
# SPDX-License-Identifier: MIT
#
# This is a minimal factory.yaml configuration file.
# Edit this file to configure your API deployment.
#
# Documentation: https://github.com/seanmeehan/aws-api-factory#readme

project:
  name: my-api
  envs:
    - dev
    - prod

profile: minimal  # Options: minimal, scalable

apis:
  rest:
    enabled: true
    routes:
      - path: /hello
        methods:
          - GET
        service: hello
        auth: none

compute:
  lambda:
    enabled: true
    services:
      hello:
        entry: src/services/hello/handler.py:handler
        memory_mb: auto
        timeout_s: auto

data:
  dynamodb:
    enabled: false
  s3:
    enabled: false

secrets:
  provider: ssm

observability:
  level: basic
