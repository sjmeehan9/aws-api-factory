# SPDX-License-Identifier: MIT
# AWS API Factory Project - Python Packaging Configuration
#
# This file was generated by 'factory init'.
# Edit as needed for your project requirements.

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "my-api"
version = "0.1.0"
description = "AWS API Factory project"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = []

dependencies = [
    # AWS API Factory - the core framework
    "aws-api-factory>=0.1.0",

    # AWS CDK (included via aws-api-factory, but listed for clarity)
    "aws-cdk-lib>=2.100.0",
    "constructs>=10.0.0",

    # Add your project-specific dependencies below:
    # "requests>=2.28.0",
    # "boto3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
