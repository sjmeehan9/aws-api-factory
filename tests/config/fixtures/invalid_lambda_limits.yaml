# AWS API Factory - Invalid Configuration: Bad Lambda Limits
# Used for testing validation of Lambda memory/timeout limits

project:
  name: my-api
  envs:
    - dev

profile: minimal

apis:
  rest:
    enabled: true
    routes:
      - path: /hello
        methods:
          - GET
        service: hello
        auth: none

compute:
  lambda:
    enabled: true
    services:
      hello:
        entry: src/services/hello/handler.py:handler
        memory_mb: 50000  # Invalid - max is 10240
        timeout_s: 1800   # Invalid - max is 900
