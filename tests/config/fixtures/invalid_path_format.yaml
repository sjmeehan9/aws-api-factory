# AWS API Factory - Invalid Configuration: Bad Path Format
# Used for testing validation of route path format

project:
  name: my-api
  envs:
    - dev

profile: minimal

apis:
  rest:
    enabled: true
    routes:
      - path: hello  # Invalid - must start with /
        methods:
          - GET
        service: hello
        auth: none

compute:
  lambda:
    enabled: true
    services:
      hello:
        entry: src/services/hello/handler.py:handler
