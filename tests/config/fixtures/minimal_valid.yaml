# AWS API Factory - Minimal Valid Configuration Fixture
# Used for testing valid minimal configuration

project:
  name: my-api
  envs:
    - dev
    - prod

profile: minimal

apis:
  rest:
    enabled: true
    routes:
      - path: /hello
        methods:
          - GET
        service: hello
        auth: none

compute:
  lambda:
    enabled: true
    services:
      hello:
        entry: src/services/hello/handler.py:handler
        memory_mb: auto
        timeout_s: auto

data:
  dynamodb:
    enabled: false
  s3:
    enabled: false

secrets:
  provider: ssm

observability:
  level: basic
